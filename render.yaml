# Blueprint Render — JobRadar (API + Web static + Postgres)
# Docs: https://render.com/docs/blueprint-spec
#
# Les noms `jobradar-api` et `jobradar-web` étaient déjà pris sur Render :
# les services réels ont reçu un suffixe. URLs déployées :
#   API  → https://jobradar-api-mpcj.onrender.com
#   Web  → https://jobradar-web-ewb5.onrender.com
# Si vous renommez un service, mettez à jour CORS_ORIGIN / APP_ORIGIN /
# GOOGLE_*_REDIRECT_URI / LINKEDIN_*_REDIRECT_URI / VITE_API_URL en même temps.

databases:
  - name: jobradar-db
    databaseName: jobradar
    user: jobradar
    plan: free
    region: frankfurt

services:
  # ── API (Express + Prisma) ──────────────────────────────────────────────
  - type: web
    name: jobradar-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: api
    branch: main
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run db:migrate:deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobradar-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://jobradar-web-ewb5.onrender.com
      - key: APP_ORIGIN
        value: https://jobradar-web-ewb5.onrender.com
      # SMTP : Render (plan gratuit) bloque les ports 25 / 465 / 587.
      # Brevo/Resend/Mailgun acceptent 2525 (STARTTLS) → seul port utilisable ici.
      # MAIL_REQUIRED ne bloque plus le démarrage (l'API sert sans e-mail) ;
      # l'état réel est visible sur /health.
      - key: MAIL_REQUIRED
        value: "true"
      # Secours tant que l'envoi d'e-mails ne fonctionne pas sur Render :
      # connexion mot de passe seul, sans code OTP. Repassez à "true" dès que
      # /health indique mail.verified: true.
      - key: LOGIN_OTP_REQUIRED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # IA : groq en tête (Gemini n'est pas dans la chaîne de fallback sur clé invalide).
      - key: AI_PROVIDER
        value: groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # OAuth (optionnel) — redirect HTTPS vers l'API Render
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://jobradar-api-mpcj.onrender.com/auth/google/callback
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        value: https://jobradar-api-mpcj.onrender.com/auth/linkedin/callback

  # ── Web (Vite → site statique) ──────────────────────────────────────────
  - type: web
    name: jobradar-web
    runtime: static
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://jobradar-api-mpcj.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
